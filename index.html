<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f6f7f4">
    <title>Haven — Apartment management</title>
    <link rel="stylesheet" href="styles.css?v=room-manager-1">
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Main navigation">
        <a class="brand" href="#" aria-label="Haven home">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" fill="none"><path d="M5 14.5 16 5l11 9.5V27H5V14.5Z" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><path d="M12 27v-8h8v8M11 13h.01M21 13h.01" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
          <span class="brand-copy"><strong>haven</strong><small>PROPERTY MANAGER</small></span>
        </a>

        <div class="nav-label">WORKSPACE</div>
        <nav class="main-nav">
          <button class="nav-item active" data-view="overview"><span class="nav-icon" aria-hidden="true">⌂</span>Overview</button>
          <button class="nav-item" data-view="tenants"><span class="nav-icon" aria-hidden="true">♙</span>Tenants<span class="nav-count" id="nav-tenant-count">0</span></button>
          <button class="nav-item" data-view="buildings"><span class="nav-icon" aria-hidden="true">▥</span>Buildings</button>
          <button class="nav-item" data-view="daily"><span class="nav-icon" aria-hidden="true">▣</span>Daily rentals</button>
          <button class="nav-item" data-view="history"><span class="nav-icon" aria-hidden="true">◷</span>Past tenants</button>
        </nav>

        <div class="sidebar-bottom">
          <div class="help-card">
            <span class="help-sparkle" aria-hidden="true">✳</span>
            <strong>Everything in one place</strong>
            <p>Your tenant records are saved automatically on this device.</p>
          </div>
          <div class="profile">
            <div class="avatar avatar-owner">O</div>
            <div class="profile-copy"><strong>Property owner</strong><span>My workspace</span></div>
            <span class="profile-menu" aria-hidden="true">···</span>
          </div>
        </div>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <div class="breadcrumb"><span>Workspace</span><span class="breadcrumb-divider">/</span><strong id="breadcrumb-current">Overview</strong></div>
          <div class="topbar-right">
            <span class="today-label" id="today-label"></span>
            <span class="secure-label"><span class="secure-dot" id="cloud-status-dot"></span><span id="cloud-status">Saved on this device</span></span>
            <button class="text-button share-availability-button" id="share-availability-button" type="button" data-action="share-availability" hidden>Share availability</button>
            <button class="text-button room-manager-access-button" id="room-manager-access-button" type="button" data-action="room-manager-access" hidden>NATO room access</button>
            <button class="text-button room-manager-requests-button" id="room-manager-requests-button" type="button" data-action="room-manager-requests" hidden>Review NATO requests</button>
            <button class="text-button cloud-account-button" id="cloud-account-button" type="button">Connect cloud</button>
          </div>
        </header>
        <div id="app-content" class="page-content"></div>
      </main>
    </div>

    <div id="modal-root"></div>
    <div id="cloud-root" hidden></div>
    <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="app.js?v=room-manager-1"></script>
  </body>
</html>
